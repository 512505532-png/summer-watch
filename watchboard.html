<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>暑期未成年人保护舆情监测看板</title>
<style>
  :root{
    --bg:#f4f6fb; --card:#ffffff; --ink:#1f2733; --sub:#67718a;
    --line:#e8ecf4; --brand:#2b5ce6;
    --red:#e5484d; --redbg:#fde9ea;
    --yellow:#d99114; --yellowbg:#fdf3df;
    --green:#1f9d63; --greenbg:#e4f6ec;
    --shadow:0 1px 3px rgba(20,40,80,.06),0 6px 24px rgba(20,40,80,.06);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.6;font-size:14px;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1180px;margin:0 auto;padding:28px 22px 60px}

  /* header */
  header.top{background:linear-gradient(120deg,#23306b,#2b5ce6);color:#fff;border-radius:16px;
    padding:26px 30px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  header.top::after{content:"";position:absolute;right:-40px;top:-40px;width:200px;height:200px;
    background:rgba(255,255,255,.07);border-radius:50%}
  header.top h1{font-size:23px;font-weight:700;letter-spacing:.5px}
  header.top .period{margin-top:6px;font-size:13.5px;opacity:.9}
  .metabar{display:flex;flex-wrap:wrap;gap:16px;margin-top:16px;font-size:12.5px}
  .metabar span{background:rgba(255,255,255,.14);padding:5px 12px;border-radius:20px}
  .note{margin-top:14px;font-size:12px;opacity:.82;background:rgba(0,0,0,.12);
    padding:8px 12px;border-radius:8px;border-left:3px solid rgba(255,255,255,.5)}
  .updated{margin-top:8px;font-size:11.5px;opacity:.7}

  h2.sec{font-size:16px;font-weight:700;margin:34px 0 14px;padding-left:11px;
    border-left:4px solid var(--brand);display:flex;align-items:center;gap:8px}
  h2.sec small{font-weight:400;color:var(--sub);font-size:12px}

  /* alerts */
  .alerts{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
  .alert{background:var(--card);border-radius:12px;padding:15px 16px;box-shadow:var(--shadow);
    border-left:5px solid var(--line);display:flex;flex-direction:column;gap:6px}
  .alert.red{border-left-color:var(--red)} .alert.yellow{border-left-color:var(--yellow)} .alert.green{border-left-color:var(--green)}
  .alert .ahead{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
  .dot{width:10px;height:10px;border-radius:50%;flex:none}
  .dot.red{background:var(--red)} .dot.yellow{background:var(--yellow)} .dot.green{background:var(--green)}
  .alert .atext{font-size:12.5px;color:var(--sub)}
  .tag{font-size:11px;padding:2px 8px;border-radius:6px;font-weight:600}
  .tag.red{background:var(--redbg);color:var(--red)} .tag.yellow{background:var(--yellowbg);color:var(--yellow)} .tag.green{background:var(--greenbg);color:var(--green)}

  /* timeline */
  .timeline{background:var(--card);border-radius:14px;padding:8px 4px;box-shadow:var(--shadow);overflow-x:auto}
  .tl-row{display:flex;min-width:820px;align-items:stretch}
  .tl-node{flex:1;padding:16px 14px;border-right:1px dashed var(--line);
    display:flex;flex-direction:column}
  .tl-node:last-child{border-right:none}
  .tl-date{font-weight:700;color:var(--brand);font-size:13px}
  .tl-name{font-size:12.5px;font-weight:600;margin:3px 0 8px}
  .tl-h{font-size:11.5px;color:var(--sub);background:var(--bg);padding:7px 9px;border-radius:7px;
    margin-bottom:6px;flex:1 1 auto}
  .tl-a{font-size:11.5px;color:#0d7a4e;background:var(--greenbg);padding:7px 9px;border-radius:7px;
    margin-top:auto}
  .tl-a.todo{color:var(--sub);background:var(--bg)}
  .tl-lbl{font-size:10px;color:#9aa3b8;display:block;margin-bottom:2px;font-weight:600}

  /* game cards */
  .games{display:grid;grid-template-columns:repeat(auto-fill,minmax(540px,1fr));gap:16px;align-items:start}
  .gcard{background:var(--card);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
  .ghead{padding:16px 18px;color:#fff;display:flex;justify-content:space-between;align-items:flex-start;min-height:72px}
  .ghead h3{font-size:17px;font-weight:700}
  .ghead .pat{font-size:11.5px;opacity:.92;margin-top:4px;max-width:330px}
  .gstat{font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;background:rgba(255,255,255,.22);white-space:nowrap}
  .gbody{padding:14px 18px 18px}
  .stats{display:flex;gap:22px;margin-bottom:12px}
  .stat .n{font-size:20px;font-weight:800} .stat .l{font-size:11px;color:var(--sub)}
  .blk{margin-top:13px}
  .blk .bt{font-size:12px;font-weight:700;color:var(--ink);margin-bottom:7px;display:flex;align-items:center;gap:6px}
  .bar{display:flex;align-items:center;gap:8px;margin-bottom:5px}
  .bar .bl{font-size:11.5px;width:210px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bar .bw{flex:1;background:var(--bg);border-radius:5px;height:14px;overflow:hidden}
  .bar .bf{height:100%;border-radius:5px}
  .bar .bv{font-size:11px;font-weight:700;width:34px;text-align:right}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-size:11px;background:var(--bg);padding:4px 9px;border-radius:7px;color:var(--sub)}
  .chip b{color:var(--ink)}
  .case{font-size:11.5px;color:var(--sub);padding:5px 0;border-bottom:1px dashed var(--line)}
  .case:last-child{border:none} .case b{color:var(--red);font-weight:600}
  .wk{font-size:11.5px;background:var(--bg);padding:8px 10px;border-radius:8px;margin-top:4px;display:flex;gap:8px;align-items:flex-start;min-height:54px}

  /* common topics */
  .ctopics{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px;align-items:stretch}
  .ct{background:var(--card);border-radius:12px;padding:15px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column}
  .ct h4{font-size:13.5px;font-weight:700;margin-bottom:6px}
  .ct p{font-size:12px;color:var(--sub);margin-bottom:9px;flex:1 1 auto}
  .ct .gg{display:flex;flex-wrap:wrap;gap:5px;margin-top:auto}
  .ct .gg span{font-size:10.5px;background:#eef2fd;color:var(--brand);padding:2px 8px;border-radius:6px;font-weight:600}

  /* loading */
  .loading{text-align:center;padding:60px 20px;color:var(--sub);font-size:15px}
  .err{text-align:center;padding:60px 20px;color:var(--red);font-size:14px}

  footer{margin-top:40px;text-align:center;color:#9aa3b8;font-size:11.5px;line-height:1.8}
  @media(max-width:600px){.games,.metabar{grid-template-columns:1fr}.bar .bl{width:140px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1 id="h-title">暑期未成年人保护舆情监测看板</h1>
    <div class="period" id="h-period"></div>
    <div class="metabar" id="h-meta"></div>
    <div class="note" id="h-note"></div>
    <div class="updated" id="h-updated"></div>
  </header>

  <h2 class="sec">🚨 本期预警 <small>状态灯：红=预警 / 黄=关注 / 绿=平稳</small></h2>
  <div class="alerts" id="alerts"></div>

  <h2 class="sec">📅 暑期时间轴 <small>历史规律 vs 本期实际（5月中旬 → 9月初）</small></h2>
  <div class="timeline"><div class="tl-row" id="timeline"></div></div>

  <h2 class="sec">🎮 四款游戏监测 <small>滚动展示当周数据 + 渠道/观点/案例</small></h2>
  <div class="games" id="games"></div>

  <h2 class="sec">🔗 共性议题横向追踪 <small>跨产品高频议题</small></h2>
  <div class="ctopics" id="ctopics"></div>

  <footer id="footer"></footer>
</div>

<script>
const LV = {red:'red',yellow:'yellow',green:'green'};
const LVTXT = {red:'预警',yellow:'关注',green:'平稳'};
const esc = s => String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

let D = null;

function render(){
  if(!D) return;
  const $ = id => document.getElementById(id);

  $('h-title').textContent = D.meta.title;
  $('h-period').textContent = D.meta.period;
  $('h-meta').innerHTML =
    `<span>📌 ${esc(D.meta.weekLabel||'')}</span>`+
    `<span>🗓 更新日期：${esc(D.meta.updateDate||'')}</span>`+
    `<span>👥 ${esc(D.meta.owner||'')}</span>`;
  $('h-note').textContent = '说明：' + (D.meta.note||'');
  $('h-updated').textContent = '数据最后更新：' + (D.meta.updateDate||'—');

  // alerts
  $('alerts').innerHTML = (D.alerts||[]).map(a=>`
    <div class="alert ${LV[a.level]||'green'}">
      <div class="ahead"><span class="dot ${LV[a.level]||'green'}"></span>${esc(a.game||'')}
        <span class="tag ${LV[a.level]||'green'}" style="margin-left:auto">${LVTXT[a.level]||''}</span></div>
      <div class="atext">${esc(a.text||'')}</div>
    </div>`).join('');

  // timeline
  $('timeline').innerHTML = (D.timeline||[]).map(t=>{
    const isTodo = !t.actual || t.actual.startsWith('（待填') || t.actual.startsWith('(待填');
    return `<div class="tl-node">
      <div class="tl-date">${esc(t.date||'')}</div>
      <div class="tl-name">${esc(t.node||'')}</div>
      <div class="tl-h"><span class="tl-lbl">历史规律</span>${esc(t.history||'')}</div>
      <div class="tl-a ${isTodo?'todo':''}"><span class="tl-lbl">本期实际</span>${esc(t.actual||'（待填）')}</div>
    </div>`;
  }).join('');

  // games
  $('games').innerHTML = (D.games||[]).map(g=>{
    const last = (g.weekly||[])[(g.weekly||[]).length-1] || {};
    const maxPct = Math.max(1,...(g.topics||[]).map(t=>t.pct||0));
    const topics = (g.topics||[]).filter(t=>(t.pct||0)>0).map(t=>`
      <div class="bar">
        <span class="bl" title="${esc((t.cat||'')+'·'+(t.label||''))}">${esc(t.label||'')}</span>
        <span class="bw"><span class="bf" style="width:${maxPct>0?Math.round((t.pct||0)/maxPct*100):0}%;background:${g.color||'#999'}"></span></span>
        <span class="bv">${(t.pct||0)}%</span>
      </div>`).join('');
    const channels = (g.channels||[]).map(c=>`<span class="chip"><b>${esc(c.name||'')}</b> ${esc(c.note||'')}</span>`).join('');
    const cases = (g.cases||[]).map(c=>`<div class="case"><b>${esc(c.date||'')}</b> ${esc(c.text||'')}</div>`).join('');
    return `
    <div class="gcard">
      <div class="ghead" style="background:${g.color||'#666'}">
        <div><h3>${esc(g.name||'')}</h3><div class="pat">${esc(g.pattern||'')}</div></div>
        <span class="gstat">● ${LVTXT[g.status]||''}</span>
      </div>
      <div class="gbody">
        <div class="stats">
          <div class="stat"><div class="n" style="color:${g.color||'#666'}">${esc(g.totalPosts||'-')}</div><div class="l">累计发帖量</div></div>
          <div class="stat"><div class="n" style="color:${g.color||'#666'}">${esc(g.totalInteract||'-')}</div><div class="l">发帖+评论量</div></div>
        </div>
        <div class="blk"><div class="bt">📈 本周动态</div>
          <div class="wk"><span class="tag ${LV[last.status]||'green'}">${LVTXT[last.status]||''}</span>
          <span>${esc(last.week||'')}：声量${last.volume||'-'} / 发帖${last.posts||'-'}。${(last.highlight||'')}</span></div>
        </div>
        <div class="blk"><div class="bt">🗂 主要观点聚类（Top）</div>${topics}</div>
        <div class="blk"><div class="bt">📡 渠道分布</div><div class="chips">${channels}</div></div>
        <div class="blk"><div class="bt">⚠️ 典型案例</div>${cases}</div>
      </div>
    </div>`;
  }).join('');

  // common topics
  $('ctopics').innerHTML = (D.commonTopics||[]).map(c=>`
    <div class="ct">
      <h4>🔸 ${esc(c.topic||'')}</h4>
      <p>${esc(c.desc||'')}</p>
      <div class="gg">${(c.games||[]).map(g=>`<span>${esc(g)}</span>`).join('')}</div>
    </div>`).join('');

  $('footer').innerHTML =
    `本看板数据每周更新 · 数据来源：舆情监测系统导入 + Feedly MCP 监控<br>`+
    `最后更新：${esc(D.meta.updateDate||'—')} · <a href="./watchboard-data.json" target="_blank" style="color:var(--brand)">查看原始数据</a>`;
}

// 加载外部数据
async function loadData(){
  const container = document.getElementById('alerts').parentElement;
  // 显示 loading
  document.getElementById('alerts').innerHTML = '<div class="loading">📡 正在加载数据...</div>';
  
  // 尝试多个可能的数据路径
  const paths = [
    './watchboard-data.json',
    './data.json',
    '../summer-watch/data.json'
  ];
  
  let lastErr = null;
  for(const p of paths){
    try {
      const resp = await fetch(p + '?t=' + Date.now());
      if(resp.ok){
        D = await resp.json();
        render();
        console.log('[看板] 数据加载成功：', p);
        return;
      }
    } catch(e){ lastErr = e; }
  }
  
  // 全部失败：显示错误 + 示例数据
  console.error('[看板] 数据加载失败，使用内置示例数据', lastErr);
  document.getElementById('alerts').innerHTML =
    '<div class="err">⚠️ 无法加载外部数据文件，当前显示示例数据。<br>请将 <b>watchboard-data.json</b> 放在与本页面相同目录下。</div>';
  
  // 内置最小化示例数据防止空白
  D = {
    meta:{ title:"暑期未成年人保护舆情监测看板（示例）", period:"2026年5月中旬 — 9月初", weekLabel:"示例数据", updateDate:"—", owner:"未保舆情监测组", note:"请将 watchboard-data.json 放在与本页面相同目录下" },
    alerts:[],
    timeline:[ {date:"示例",node:"示例节点",history:"—",actual:"待填"} ],
    games:[],
    commonTopics:[]
  };
  render();
}

loadData();
</script>
</body>
</html>
